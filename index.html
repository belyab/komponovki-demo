<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компоновки — демо</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #f4f4f4; }
    body { display: grid; place-items: center; overflow: auto; }
    .stage { width: 1024px; height: 768px; flex: none; position: relative; background: white; }
    .stage img { display: block; width: 1024px; height: 768px; }
    @media (max-width: 1024px), (max-height: 768px) {
      body { place-items: start center; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Исходная страница карточки вебинара из Figma">
    <img src="assets/main-page.png" width="1024" height="768" alt="Исходный экран карточки вебинара из Figma">
  </main>
</body>
</html>
