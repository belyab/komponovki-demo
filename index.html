.content{width:552px;min-height:1075px;background:#fff;padding:0 0 12px}
.stream-card{width:520px;height:378px;margin:0 16px 18px;background:#e6e8ee;border-radius:14px;padding:0;position:relative}
.stream-controls{height:58px;display:flex;align-items:center;padding:0 0;gap:20px;font-size:14px}
.swatch{width:24px;height:24px;border-radius:50%;display:inline-block;vertical-align:middle;border:1px solid #d8dce3;background:#e6e8ee}
.swatch.black{background:#000;border-color:#000}
.stream-preview{height:332px;width:520px;display:flex;background:#e6e8ee;border-radius:14px;overflow:hidden}
.video-side{width:367px;padding:16px;flex:none}
.video-title{height:39px;display:flex;align-items:flex-start;justify-content:space-between;font-size:16px}
.live{width:33px;height:20px;border-radius:12px;background:#e51d19}
.camera-stage{height:265px;border-radius:14px;background:#f8f8f8;box-shadow:0 2px 5px #0000001a;display:grid;place-items:center}
.person-icon{width:48px;height:48px;border-radius:50%;background:#e5fbff;position:relative}
.person-icon:before{content:"";position:absolute;left:16px;top:7px;width:16px;height:16px;border:2px solid #111;border-radius:50%}
.person-icon:after{content:"";position:absolute;left:10px;bottom:5px;width:28px;height:17px;border:2px solid #111;border-bottom:0;border-radius:18px 18px 0 0}
.tools-side{flex:1;padding:0 8px 0 0}
.tools-heading{height:47px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.tool-chip{height:32px;margin-bottom:8px;border-radius:18px;background:#fff;box-shadow:0 2px 4px #00000012;display:flex;align-items:center;padding:0 12px;gap:7px;font-size:14px;white-space:nowrap}
.tool-icon{color:#8d9ab1;font-size:14px}
.layouts-card{width:552px;margin:0 0 18px;padding:12px 16px 16px;background:#fff;border-radius:14px}
.layouts-title{font-size:16px;line-height:20px;font-weight:700;margin:0 0 5px}
.layouts-subtitle{font-size:14px;line-height:18px;color:#999;margin:0 0 12px}
.layout-grid{display:grid;grid-template-columns:256px 256px;gap:12px}
.layout-tile{height:142px;border:3px solid #f6f6f6;border-radius:13px;background:#fafafa;padding:3px;position:relative;display:flex;overflow:hidden;cursor:pointer}
.layout-tile:hover{box-shadow:0 1px 6px #0000000c}
.tile-check{position:absolute;right:4px;top:3px;width:24px;height:24px;border-radius:50%;background:#0ba53b;color:white;display:grid;place-items:center;font-size:16px;z-index:2}
.tile-edit{position:absolute;right:5px;bottom:5px;width:30px;height:30px;border-radius:7px;background:#fff;border:1px solid #e5e5e5;box-shadow:0 1px 4px #0002;display:grid;place-items:center;color:#718096;font-size:18px;opacity:0;pointer-events:none;z-index:3;cursor:pointer}
.layout-tile:hover .tile-edit,.layout-tile:focus-within .tile-edit{opacity:1;pointer-events:auto}
.tile-person,.tile-demo{flex:1;display:grid;place-items:center;background:#f7f7f7;border-radius:8px;position:relative}
.tile-demo{background:#f6f6f6}
.tile-avatar{width:42px;height:42px;border-radius:50%;background:#fff;position:relative;display:block}
.tile-avatar:before{content:"";position:absolute;left:14px;top:6px;width:13px;height:13px;border-radius:50%;background:#c9c9c9}
.tile-avatar:after{content:"";position:absolute;left:11px;bottom:5px;width:19px;height:17px;border-radius:11px 11px 5px 5px;background:#c9c9c9}
.tile-screen{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative}
.tile-screen:before{content:"";width:28px;height:21px;background:#f28b2f;border-radius:4px}
.tile-screen:after{content:"";position:absolute;bottom:9px;width:14px;height:2px;background:#f28b2f}
.tile-side{width:35%;display:flex;flex-direction:column;gap:3px}
.tile-side .tile-person{min-height:0}
.tile-mini{width:16px;height:16px;border-radius:50%;background:#fff;position:relative}
.tile-mini:before{content:"";position:absolute;left:6px;top:3px;width:4px;height:4px;border-radius:50%;background:#c9c9c9}
.tile-mini:after{content:"";position:absolute;left:5px;bottom:3px;width:6px;height:6px;border-radius:4px 4px 2px 2px;background:#c9c9c9}
.tile-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px}
.tile-grid .tile-person{border-radius:5px}
.lower-section{height:360px;width:520px;margin:0 16px;background:#fff}
.panel{display:block;width:300px;height:768px;flex:none;object-fit:fill}
